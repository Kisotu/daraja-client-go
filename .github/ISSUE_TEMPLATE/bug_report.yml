name: Bug Report
description: Report a bug to help us improve
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create client with '...'
        2. Call method '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of daraja-client-go are you using?
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Run `go version`
      placeholder: "go1.25.9"
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, error output, or screenshots (redact all secrets)