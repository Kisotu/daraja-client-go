name: Feature Request
description: Suggest a new feature or improvement
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Thanks for your suggestion! Please check existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions you've considered
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (nice to have)
        - Medium (important but not blocking)
        - High (blocking my use case)
    validations:
      required: true