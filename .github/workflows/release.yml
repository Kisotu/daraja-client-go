name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          check-latest: true

      - name: Verify Go version
        run: go version

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o daraja-cli ./cmd/daraja-cli

      - name: Verify module
        run: go list -m github.com/Kisotu/daraja-client-go@${{ github.ref_name }}

      - name: Generate checksums
        run: |
          sha256sum daraja-cli > daraja-cli.sha256
          sha256sum CHANGELOG.md > CHANGELOG.md.sha256

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          sed -n "/^## \\[${{ steps.get_version.outputs.VERSION }}/,/^## /p" CHANGELOG.md | head -n -2 > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry for ${{ steps.get_version.outputs.VERSION }}, using fallback"
            echo "Release ${{ steps.get_version.outputs.VERSION }}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            daraja-cli
            daraja-cli.sha256
            CHANGELOG.md.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: false