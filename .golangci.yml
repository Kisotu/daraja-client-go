version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - ineffassign
    - misspell
    - unconvert
    - unparam
  exclusions:
    paths:
      - _test\.go$
formatters:
  enable:
    - gofmt
    - goimports
issues:
  exclude:
    - "exported:"
    - "should have comment"
    - "ST1000"
run:
  timeout: 5m
